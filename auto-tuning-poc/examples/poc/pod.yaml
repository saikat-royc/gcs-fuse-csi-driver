apiVersion: v1
kind: Pod
metadata:
  name: demopod
  annotations:
    gke-gcsfuse/volumes: "true"
    #gke-gcsfuse/ephemeral-storage-limit: "5Gi"
spec:
  containers:
  - image: busybox
    name: busybox
    command: ["sleep"]
    args: ["infinity"]
    volumeMounts:
    - name: gcs-fuse-csi-static
      mountPath: /data
      readOnly: true
  serviceAccountName: pod-ksa
  volumes:
  - name: gcs-fuse-csi-static
    persistentVolumeClaim:
      claimName: pocpvc
      readOnly: true
